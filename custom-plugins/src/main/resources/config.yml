# ─────────────────────────────────────────────────────────────
# CustomPlugins configuration
#
# One key per feature. Set it to false and restart to turn that feature off
# without touching code or rebuilding.
#
# On first run this is copied to plugins/CustomPlugins/config.yml. Edit THAT
# copy at runtime — this one is only the default baked into the jar.
# ─────────────────────────────────────────────────────────────

features:
  # Custom join/quit messages and a welcome title.
  welcome: true

  # /wand — a blaze rod that launches you forward on right-click.
  # Requires the smp.wand permission; operators have it automatically.
  wand: true

  # /current, /old, /oldest — jump between the archived realm worlds.
  # Requires the smp.worlds permission; operators have it automatically.
  # To let everyone use them:
  #   /lp group default permission set smp.worlds true
  worlds: true

  # /speedrun — a hardcore team speedrun world. One death ends the run for
  # everyone and the world rebuilds itself; /speedrun reset does it on demand.
  #
  # Requires Multiverse-Core (it manages the worlds) and the smp.speedrun
  # permission; operators have that automatically. To let everyone in:
  #   /lp group default permission set smp.speedrun true
  #
  # Turning this off leaves the speedrun worlds on disk untouched — they just
  # stop being reachable. See docs/SPEEDRUN-WORLD.md.
  speedrun: true
